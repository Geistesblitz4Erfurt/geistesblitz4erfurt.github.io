  - id: g_024
    sl: "Kako si?"
    en: "How are you? (informal)"
    register: informal
    intonation: q_wh
  - id: g_025
    sl: "Dobro, hvala."
    en: "Good, thanks."
  - id: g_026
    sl: "Se vidiva."
    en: "See you. (informal)"
    register: informal
  - id: g_027
    sl: "Se vidimo."
    en: "See you. (plural/formal)"
  - id: g_028
    sl: "Dobrodošli."
    en: "Welcome. (plural/formal)"
  - id: g_029
    sl: "Dobrodošla."
    en: "Welcome. (singular feminine)"
  - id: g_030
    sl: "Dobrodošel."
    en: "Welcome. (singular masculine)"

# --- slot templates (controlled variation) ---
templates:
  - id: g_t01
    template: "{GREETING}, {ADDRESS}."
    intonation: decl
    variants_cap: 4
    slots:
      GREETING: ["Dober dan", "Dobro jutro", "Dober večer"]
      ADDRESS: ["gospod", "gospa"]
    en_template: "{GREETING_EN}, {ADDRESS_EN}."
    en_slots:
      GREETING_EN: ["Good day", "Good morning", "Good evening"]
      ADDRESS_EN: ["sir", "madam"]

  - id: g_t02
    template: "Moje ime je {NAME}."
    intonation: decl
    variants_cap: 3
    slots:
      NAME: ["Ana", "Marko", "Peter"]
    en_template: "My name is {NAME}."
    en_slots:
      NAME: ["Ana", "Marko", "Peter"]

  - id: g_t03
    template: "Ali govorite {LANG}?"
    intonation: q_yn
    variants_cap: 3
    slots:
      LANG: ["angleško", "nemško", "italijansko"]
    en_template: "Do you speak {LANG_EN}?"
    en_slots:
      LANG_EN: ["English", "German", "Italian"]

  - id: g_t04
    template: "Ne govorim {LANG}."
    intonation: decl
    variants_cap: 2
    slots:
      LANG: ["slovensko", "dobro slovensko"]
    en_template: "I don't speak {LANG_EN}."
    en_slots:
      LANG_EN: ["Slovenian", "Slovenian well"]

  - id: g_t05
    template: "Lahko {VERB} {OBJECT}?"
    intonation: q_yn
    variants_cap: 4
    slots:
      VERB: ["ponovite", "govorite počasi"]
      OBJECT: ["prosim", ""]
    en_template: "Could you {VERB_EN} {OBJECT_EN}?"
    en_slots:
      VERB_EN: ["repeat", "speak slowly"]
      OBJECT_EN: ["please", ""]

  - id: g_t06
    template: "Sem iz {COUNTRY}."
    intonation: decl
    variants_cap: 4
    slots:
      COUNTRY: ["Nemčije", "Avstrije", "Švice", "Italije"]
    en_template: "I am from {COUNTRY_EN}."
    en_slots:
      COUNTRY_EN: ["Germany", "Austria", "Switzerland", "Italy"]
