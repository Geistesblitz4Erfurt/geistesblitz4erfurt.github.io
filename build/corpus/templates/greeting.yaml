# Category: greeting & politeness (50 sentences target)
# Register: formal (tourist default); a few informal variants labelled.
# Each entry is either a fixed sentence or a slot template.
# Generator (build/corpus/corpus_builder.py) expands slots cartesian × variant_cap.

category: greeting
default_register: formal
default_intonation: decl

# --- fixed sentences (high frequency, no variation) ---
fixed:
  - id: g_001
    sl: "Dober dan."
    en: "Good day."
    intonation: decl
    notes: "Standard daytime greeting."
  - id: g_002
    sl: "Dobro jutro."
    en: "Good morning."
    intonation: decl
  - id: g_003
    sl: "Dober večer."
    en: "Good evening."
    intonation: decl
  - id: g_004
    sl: "Lahko noč."
    en: "Good night."
    intonation: decl
  - id: g_005
    sl: "Nasvidenje."
    en: "Goodbye."
    intonation: decl
  - id: g_006
    sl: "Živjo."
    en: "Hi."
    register: informal
  - id: g_007
    sl: "Zdravo."
    en: "Hello."
    register: informal
  - id: g_008
    sl: "Adijo."
    en: "Bye."
    register: informal
  - id: g_009
    sl: "Hvala."
    en: "Thank you."
  - id: g_010
    sl: "Hvala lepa."
    en: "Thank you very much."
  - id: g_011
    sl: "Najlepša hvala."
    en: "Thank you so much."
  - id: g_012
    sl: "Prosim."
    en: "Please. / You're welcome."
    notes: "Dual use: request marker and response to thanks."
  - id: g_013
    sl: "Ni za kaj."
    en: "You're welcome. (lit. not for what)"
  - id: g_014
    sl: "Ja."
    en: "Yes."
  - id: g_015
    sl: "Ne."
    en: "No."
  - id: g_016
    sl: "Oprostite."
    en: "Excuse me. (formal)"
  - id: g_017
    sl: "Oprosti."
    en: "Sorry. (informal)"
    register: informal
  - id: g_018
    sl: "Žal mi je."
    en: "I'm sorry."
  - id: g_019
    sl: "Razumem."
    en: "I understand."
  - id: g_020
    sl: "Ne razumem."
    en: "I don't understand."
  - id: g_021
    sl: "Ne vem."
    en: "I don't know."
  - id: g_022
    sl: "V redu."
