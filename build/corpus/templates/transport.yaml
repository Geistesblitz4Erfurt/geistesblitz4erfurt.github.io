templates:
  - id: t_t01
    template: "Vozovnica za {CITY}, prosim."
    intonation: decl
    variants_cap: 5
    slots:
      CITY: ["Ljubljano", "Maribor", "Koper", "Bled", "Celje"]
    en_template: "A ticket to {CITY_EN}, please."
    en_slots:
      CITY_EN: ["Ljubljana", "Maribor", "Koper", "Bled", "Celje"]

  - id: t_t02
    template: "Kako pridem do {PLACE}?"
    intonation: q_wh
    variants_cap: 4
    slots:
      PLACE: ["centra", "postaje", "muzeja", "hotela"]
    en_template: "How do I get to the {PLACE_EN}?"
    en_slots:
      PLACE_EN: ["centre", "station", "museum", "hotel"]

  - id: t_t03
    template: "Ali {VEHICLE} pelje do {DEST}?"
    intonation: q_yn
    variants_cap: 4
    slots:
      VEHICLE: ["avtobus", "vlak"]
      DEST: ["Ljubljane", "Bleda"]
    en_template: "Does the {VEHICLE_EN} go to {DEST_EN}?"
    en_slots:
      VEHICLE_EN: ["bus", "train"]
      DEST_EN: ["Ljubljana", "Bled"]

  - id: t_t04
    template: "{DIRECTION} na {TURN}."
    intonation: decl
    variants_cap: 4
    slots:
      DIRECTION: ["Zavijte", "Pojdite"]
      TURN: ["levo", "desno"]
    en_template: "{DIRECTION_EN} to the {TURN_EN}."
    en_slots:
      DIRECTION_EN: ["Turn", "Go"]
      TURN_EN: ["left", "right"]

  - id: t_t05
    template: "Kdaj {ACT} {VEHICLE}?"
    intonation: q_wh
    variants_cap: 4
    slots:
      ACT: ["odpelje", "prispe"]
      VEHICLE: ["vlak", "avtobus"]
    en_template: "When does the {VEHICLE_EN} {ACT_EN}?"
    en_slots:
      ACT_EN: ["leave", "arrive"]
      VEHICLE_EN: ["train", "bus"]

  - id: t_t06
    template: "Kje je najbližja {PLACE}?"
    intonation: q_wh
    variants_cap: 4
    slots:
      PLACE: ["lekarna", "banka", "pošta", "bencinska črpalka"]
    en_template: "Where is the nearest {PLACE_EN}?"
    en_slots:
      PLACE_EN: ["pharmacy", "bank", "post office", "petrol station"]
